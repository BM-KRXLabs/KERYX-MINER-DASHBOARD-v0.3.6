<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<title>Keryx — Hashrate Monitor</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@100..800&display=swap" rel="stylesheet" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --mx-bg: #070a08;
    --mx-surface: #0c110d;
    --mx-border: #1c2a20;
    --mx-bright: #30ff67;
    --mx-sage-dim: #64806c;
    --mx-text: #6fd583;
    --font-mono: 'JetBrains Mono', 'Fira Code', monospace;
  }
  html, body {
    height: 100%;
    background: var(--mx-bg);
    color: var(--mx-text);
    font-family: var(--font-mono);
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }
  #app {
    display: flex;
    flex-direction: column;
    height: 100vh;
  }
  .titlebar {
    -webkit-app-region: drag;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 6px 12px;
    background: var(--mx-surface);
    border-bottom: 1px solid var(--mx-border);
    font-size: 0.65rem;
    letter-spacing: 0.1em;
    color: var(--mx-sage-dim);
    flex-shrink: 0;
  }
  .titlebar .brand { display: flex; align-items: center; gap: 8px; }
  .titlebar .dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--mx-sage-dim);
    transition: background .2s, box-shadow .2s;
  }
  .titlebar .dot.live { background: var(--mx-bright); box-shadow: 0 0 8px var(--mx-bright); }
  .winbtns { -webkit-app-region: no-drag; display: flex; gap: 8px; }
  .winbtn {
    width: 13px; height: 13px; border-radius: 50%;
    border: 1px solid var(--mx-border);
    background: transparent;
    color: var(--mx-sage-dim);
    font-size: 8px;
    line-height: 11px;
    cursor: pointer;
    text-align: center;
  }
  .winbtn:hover { background: #2f4a37; color: var(--mx-bright); }

  .body { flex: 1; padding: 12px 14px; display: flex; flex-direction: column; gap: 10px; overflow: hidden; }

  .card {
    background: linear-gradient(180deg, #0d130f, #0b0f0c);
    border: 1px solid var(--mx-border);
    border-radius: 8px;
    padding: 10px 12px;
  }
  .label {
    font-size: 0.55rem;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--mx-sage-dim);
    margin-bottom: 3px;
  }
  .hr-row { display: flex; align-items: baseline; gap: 6px; }
  .hr-big { font-size: 2rem; font-weight: 800; color: var(--mx-bright); line-height: 1; }
  .hr-unit { font-size: 0.7rem; color: var(--mx-sage-dim); }

  svg.spark { width: 100%; height: 30px; margin-top: 6px; }

  .stat-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 6px 10px;
  }
  .stat-item { display: flex; flex-direction: column; }
  .stat-label { font-size: 0.5rem; text-transform: uppercase; color: var(--mx-sage-dim); letter-spacing: 0.06em; }
  .stat-value { font-size: 0.95rem; font-weight: 600; color: var(--mx-bright); }

  .status-line {
    font-size: 0.6rem;
    color: var(--mx-sage-dim);
    text-align: center;
    padding-top: 2px;
  }
  .status-line.live { color: var(--mx-bright); }
</style>
</head>
<body>
<div id="app">
  <div class="titlebar">
    <div class="brand">
      <div class="dot" id="status-dot"></div>
      <span>hashrate monitor</span>
    </div>
    <div class="winbtns">
      <button class="winbtn" id="btn-min">–</button>
      <button class="winbtn" id="btn-close">×</button>
    </div>
  </div>

  <div class="body">
    <div class="card">
      <div class="label">Hashrate</div>
      <div class="hr-row">
        <span class="hr-big" id="hr">0.00</span>
        <span class="hr-unit" id="hr-unit">Mhash/s</span>
      </div>
      <svg class="spark" viewBox="0 0 150 30"><polyline id="spark" fill="none" stroke="var(--mx-bright)" stroke-width="1.5" points=""></polyline></svg>
    </div>

    <div class="card">
      <div class="stat-grid">
        <div class="stat-item">
          <span class="stat-label">GPU Temp</span>
          <span class="stat-value"><span id="temp">--</span> C</span>
        </div>
        <div class="stat-item">
          <span class="stat-label">Power</span>
          <span class="stat-value"><span id="power">--</span> W</span>
        </div>
        <div class="stat-item">
          <span class="stat-label">VRAM</span>
          <span class="stat-value"><span id="vram-used">--</span>/<span id="vram-total">--</span> GB</span>
        </div>
        <div class="stat-item">
          <span class="stat-label">Blocks</span>
          <span class="stat-value" id="block-count">0</span>
        </div>
      </div>
    </div>

    <div class="status-line" id="status-line">idle</div>
  </div>
</div>
<script src="hashrate-renderer.js"></script>
</body>
</html>
